<!-- MASTHEAD -->
<header class="masthead">
  <div class="masthead-inner">
    <a href="{{ site.host_conference_url }}" target="_blank" rel="noopener" class="qw-logo-link" title="IEEE Quantum Week {{ site.year }}">
      <svg class="qw-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="IEEE Quantum Week">
        <g transform="rotate(45 50 50)">
          <rect x="14" y="14" width="72" height="72" rx="3" fill="#1c2348"/>
          <rect x="14" y="14" width="72" height="72" rx="3" fill="none" stroke="#3a4470" stroke-width="1.2"/>
        </g>
        <text x="50" y="42" text-anchor="middle"
              font-family="'JetBrains Mono', monospace"
              font-size="10" font-weight="700" fill="#ffffff"
              letter-spacing="1">IEEE</text>
        <text x="50" y="56" text-anchor="middle"
              font-family="'JetBrains Mono', monospace"
              font-size="8" font-weight="600" fill="#e8eaf5"
              letter-spacing="0.6">QUANTUM</text>
        <text x="50" y="68" text-anchor="middle"
              font-family="'JetBrains Mono', monospace"
              font-size="8" font-weight="600" fill="#e8eaf5"
              letter-spacing="0.6">WEEK</text>
      </svg>
    </a>

    <div class="logo-mark">
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-label="DQC-SI logo">
        <defs>
          <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1e4d8c"/>
            <stop offset="100%" stop-color="#2d6cb7"/>
          </linearGradient>
        </defs>
        <circle cx="20" cy="22" r="9" fill="url(#grad-blue)"/>
        <circle cx="60" cy="22" r="9" fill="url(#grad-blue)"/>
        <circle cx="40" cy="58" r="9" fill="url(#grad-blue)"/>
        <line x1="20" y1="22" x2="60" y2="22" stroke="#1e4d8c" stroke-width="1.5" stroke-dasharray="3,3"/>
        <line x1="20" y1="22" x2="40" y2="58" stroke="#1e4d8c" stroke-width="1.5" stroke-dasharray="3,3"/>
        <line x1="60" y1="22" x2="40" y2="58" stroke="#1e4d8c" stroke-width="1.5" stroke-dasharray="3,3"/>
        <circle cx="20" cy="22" r="3" fill="#fff"/>
        <circle cx="60" cy="22" r="3" fill="#fff"/>
        <circle cx="40" cy="58" r="3" fill="#fff"/>
      </svg>
    </div>

    <div class="brand-text">
      <div class="brand-title">DQC<span class="si">-SI</span><sup>{{ site.year }}</sup></div>
      <div class="brand-tagline">{{ site.full_name }} Workshop</div>
    </div>

    <div class="masthead-right">
      <div class="date">QCE {{ site.year }}</div>
      <div class="venue">IEEE Quantum Week</div>
      <div class="colocate">held in conjunction with QCE'{{ site.year | modulo: 100 }}</div>
    </div>
  </div>
</header>
